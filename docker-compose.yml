# Pulsync Self-Hosted — Docker Compose
# Run: docker compose up -d
#
# This starts:
#   - PostgreSQL database
#   - Pulsync server (core + standalone)
#
# Devices connect to: http://<your-ip>:3000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulsync
      POSTGRES_USER: pulsync
      POSTGRES_PASSWORD: pulsync_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsync"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://pulsync:pulsync_dev@postgres:5432/pulsync
      PORT: "3000"
      DEVICE_SECRET: ${DEVICE_SECRET:-}
      OTA_STORAGE_PATH: /app/storage/firmware
    volumes:
      - firmware:/app/storage/firmware
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  firmware:
