# Pulsync self-hosted — Docker Compose
# Run: docker compose up -d
#
# Single service, fully self-contained: SQLite storage + in-process MQTT broker.
# No external database needed.
#
#   Dashboard / device API : http://<your-ip>:3000
#   MQTT (devices)         : <your-ip>:1883
#
# To use PostgreSQL instead of SQLite, set DATABASE_URL and add your own
# postgres service.

services:
  server:
    build: .
    ports:
      - "3000:3000"   # HTTP (dashboard + device API)
      - "1883:1883"   # MQTT broker
    environment:
      PORT: "3000"
      MQTT_PORT: "1883"
      OTA_STORAGE_PATH: /app/storage/firmware
      # Optional dashboard/management password gate (empty = open):
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - data:/app          # persists the SQLite db (pulsync.db)
      - firmware:/app/storage/firmware
    restart: unless-stopped

volumes:
  data:
  firmware:
